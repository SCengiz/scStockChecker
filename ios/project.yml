# Xcode project definition. The generated scStockChecker.xcodeproj is committed,
# so builders only need Xcode; regenerate with `xcodegen` after editing this file.
name: scStockChecker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  scStockChecker:
    type: application
    platform: iOS
    sources:
      - scStockChecker
    dependencies:
      - package: Supabase
      - target: ShareExtension
    entitlements:
      path: scStockChecker/scStockChecker.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).scStockChecker.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).scStockChecker
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: scStockChecker/Info.plist
      properties:
        CFBundleDisplayName: Stok Takip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [ntfy]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        AutoLoginUser: $(AUTO_LOGIN_USER)
        AutoLoginPassword: $(AUTO_LOGIN_PASSWORD)
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).scStockChecker.shared

  # "Paylaş → Stok Takip": add a product or list straight from the Zara app.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - scStockChecker/Models
      - scStockChecker/Services
      - scStockChecker/Views/AddLinkView.swift
      - scStockChecker/Views/Components.swift
    dependencies:
      - package: Supabase
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).scStockChecker.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).scStockChecker.share
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Stok Takip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        AutoLoginUser: $(AUTO_LOGIN_USER)
        AutoLoginPassword: $(AUTO_LOGIN_PASSWORD)
        KeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).scStockChecker.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
